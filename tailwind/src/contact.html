<!DOCTYPE html>
<html lang="en" data-theme="forest">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact · PulseLab</title>
  <link rel="stylesheet" href="output.css" />
</head>
<body data-page="contact" class="bg-base-100 text-base-content">
  <div id="site-header"></div>

  <main class="max-w-3xl mx-auto px-4 py-16">
    <h1 class="text-4xl font-black mb-2">Write the desk</h1>
    <p class="opacity-70 mb-8">Questions about a program, a guest post, or a coaching clinic. We read everything. We answer most of it.</p>

    <form id="contact-form" class="card bg-base-200 shadow-xl">
      <div class="card-body gap-4">
        <label class="form-control w-full">
          <span class="label-text mb-1">Name</span>
          <input id="name" type="text" class="input input-bordered w-full" placeholder="Your name" required />
        </label>
        <label class="form-control w-full">
          <span class="label-text mb-1">Email</span>
          <input id="email" type="email" class="input input-bordered w-full" placeholder="you@email.com" required />
        </label>
        <label class="form-control w-full">
          <span class="label-text mb-1">Topic</span>
          <select class="select select-bordered w-full">
            <option>Training question</option>
            <option>Nutrition</option>
            <option>Guest article</option>
            <option>Something else</option>
          </select>
        </label>
        <label class="form-control w-full">
          <span class="label-text mb-1">Message</span>
          <textarea id="message" class="textarea textarea-bordered h-32" placeholder="What are you working on?" required></textarea>
        </label>
        <button type="submit" class="btn btn-primary">Send message</button>
      </div>
    </form>
  </main>

  <div id="contact-toast" class="toast toast-end hidden">
    <div class="alert alert-success">
      <span>Message queued. We will get back to you.</span>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
