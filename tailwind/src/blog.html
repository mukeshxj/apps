<!DOCTYPE html>
<html lang="en" data-theme="forest">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog · PulseLab</title>
  <link rel="stylesheet" href="output.css" />
</head>
<body data-page="blog" class="bg-base-100 text-base-content">
  <div id="site-header"></div>

  <main class="max-w-6xl mx-auto px-4 py-12">
    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6 mb-8">
      <div>
        <h1 class="text-4xl font-black">The journal</h1>
        <p class="opacity-70 mt-2">Filter by lane or search a topic. Every piece is written to be used this week.</p>
      </div>
      <label class="input input-bordered flex items-center gap-2 w-full md:max-w-xs">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21-4.3-4.3M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
        <input id="blog-search" type="search" class="grow" placeholder="Search articles" />
      </label>
    </div>

    <div role="tablist" class="tabs tabs-boxed w-fit flex-wrap mb-10">
      <button role="tab" class="tab tab-active" data-filter="All">All</button>
      <button role="tab" class="tab" data-filter="Strength">Strength</button>
      <button role="tab" class="tab" data-filter="Cardio">Cardio</button>
      <button role="tab" class="tab" data-filter="Nutrition">Nutrition</button>
      <button role="tab" class="tab" data-filter="Mobility">Mobility</button>
      <button role="tab" class="tab" data-filter="Recovery">Recovery</button>
    </div>

    <div id="blog-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
    <div id="blog-empty" class="hidden alert mt-8">
      <span>No articles match that filter. Try another lane or clear the search.</span>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
