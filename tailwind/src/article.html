<!DOCTYPE html>
<html lang="en" data-theme="forest">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article · PulseLab</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link rel="stylesheet" href="output.css" />
</head>
<body data-page="blog" class="bg-base-100 text-base-content">
  <div id="site-header"></div>

  <main class="max-w-6xl mx-auto px-4 py-10">
    <article id="article-root"></article>

    <section class="mt-16">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-black">Keep reading</h2>
        <div class="flex gap-2">
          <button id="related-prev" class="btn btn-circle btn-sm" aria-label="Previous">‹</button>
          <button id="related-next" class="btn btn-circle btn-sm" aria-label="Next">›</button>
        </div>
      </div>
      <div id="related-swiper" class="swiper">
        <div id="related-wrapper" class="swiper-wrapper"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
